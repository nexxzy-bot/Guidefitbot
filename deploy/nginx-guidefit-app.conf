# GuideFit — конфигурация nginx (лежит в репозитории как эталон для сервера).
# Целевой путь на сервере: /etc/nginx/sites-available/guidefit-app
#
# Зачем здесь proxy_set_header X-Forwarded-For/X-Real-IP:
#   без них Node видит IP nginx (127.0.0.1) для всех запросов, и серверные
#   лимиты (120 запросов/мин, 10 анонимных аккаунтов/час) считались бы на всех
#   пользователей вместе — приложение ловило бы 429 при обычной нагрузке.
#   В связке с `app.set('trust proxy', 1)` в server.js это даёт реальный IP.
#
# Применение:  cp deploy/nginx-guidefit-app.conf /etc/nginx/sites-available/guidefit-app
#              nginx -t && systemctl reload nginx

server {
    server_name app.xn--80aag3axnld9b.xn--p1ai;

    client_max_body_size 2m;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.xn--80aag3axnld9b.xn--p1ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.xn--80aag3axnld9b.xn--p1ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app.xn--80aag3axnld9b.xn--p1ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app.xn--80aag3axnld9b.xn--p1ai;
    return 404; # managed by Certbot


}
